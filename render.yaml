services:
  # Next.js Frontend
  - type: web
    name: profound-iq-frontend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build && cp -r public .next/standalone/public && cp -r .next/static .next/standalone/.next/static
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: PORT
        value: "3000"
      - key: NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY
        sync: false
    autoDeploy: true

  # Node.js Backend
  - type: web
    name: profound-iq-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
    autoDeploy: true
