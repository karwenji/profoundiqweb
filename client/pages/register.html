<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Profound IQ Consulting</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <div class="logo-icon">PI</div>
        <div class="logo-text">
          <span class="logo-name">PROFOUND IQ</span>
          <span class="logo-sub">CONSULTING</span>
        </div>
      </a>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div class="card">
        <h1 class="auth-title">Create Your Account</h1>
        <div id="alert-container"></div>
        <form id="register-form">
          <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input class="form-input" type="text" id="name" required disabled>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input class="form-input" type="email" id="email" required disabled>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" type="password" id="password" minlength="6" required disabled>
          </div>
          <div class="form-group">
            <label class="form-label" for="role">I am a</label>
            <select class="form-select" id="role" disabled>
              <option value="student">Student</option>
              <option value="instructor">Instructor</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn" disabled>Create Account</button>
        </form>
        <div class="auth-footer">
          Already have an account? <a href="/pages/login.html">Sign in</a>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.isAuthenticated()) {
        window.location.href = '/pages/dashboard.html';
        return;
      }

      const nameInput = document.getElementById('name');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const roleSelect = document.getElementById('role');
      const submitBtn = document.getElementById('submit-btn');
      nameInput.disabled = false;
      emailInput.disabled = false;
      passwordInput.disabled = false;
      roleSelect.disabled = false;
      submitBtn.disabled = false;

      document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertContainer = document.getElementById('alert-container');
        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const role = roleSelect.value;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating Account...';

        try {
          const response = await authAPI.register(name, email, password, role);
          Auth.login(response.user, response.token);
          window.location.href = '/pages/dashboard.html';
        } catch (err) {
          showAlert(alertContainer, err.message || 'Registration failed');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }
      });
    });
  </script>
</body>
</html>
