<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Profound IQ Consulting</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <div class="logo-icon">PI</div>
        <div class="logo-text">
          <span class="logo-name">PROFOUND IQ</span>
          <span class="logo-sub">CONSULTING</span>
        </div>
      </a>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div class="card">
        <h1 class="auth-title">Sign In to Profound IQ</h1>
        <div id="alert-container"></div>
        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input class="form-input" type="email" id="email" required disabled>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" type="password" id="password" required disabled>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn" disabled>Sign In</button>
        </form>
        <div class="auth-footer">
          Don't have an account? <a href="/pages/register.html">Sign up</a>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Redirect if already logged in
      if (Auth.isAuthenticated()) {
        window.location.href = '/pages/dashboard.html';
        return;
      }

      // Enable form inputs after auth check
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const submitBtn = document.getElementById('submit-btn');
      emailInput.disabled = false;
      passwordInput.disabled = false;
      submitBtn.disabled = false;

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertContainer = document.getElementById('alert-container');
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing In...';

        try {
          const response = await authAPI.login(email, password);
          Auth.login(response.user, response.token);
          window.location.href = '/pages/dashboard.html';
        } catch (err) {
          showAlert(alertContainer, err.message || 'Login failed');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      });
    });
  </script>
</body>
</html>
