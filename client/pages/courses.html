<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses - Profound IQ Consulting</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <div class="logo-icon">PI</div>
        <div class="logo-text">
          <span class="logo-name">PROFOUND IQ</span>
          <span class="logo-sub">CONSULTING</span>
        </div>
      </a>
      <nav class="nav">
        <a href="/" class="nav-link">Home</a>
        <a href="/pages/courses.html" class="nav-link active">Courses</a>
        <a href="/#testimonials" class="nav-link">Testimonials</a>
      </nav>
      <div class="header-actions">
        <a href="/pages/cart.html" class="icon-btn" aria-label="Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-count" id="cart-count" style="display:none;">0</span>
        </a>
        <div id="auth-buttons">
          <a href="/pages/login.html" class="btn btn-outline btn-sm">Sign In</a>
          <a href="/pages/register.html" class="btn btn-primary btn-sm">Sign Up</a>
        </div>
        <div id="user-menu" style="display:none;">
          <div class="dropdown">
            <button class="btn btn-outline btn-sm dropdown-toggle" id="user-dropdown">
              <span id="user-name">User</span>
            </button>
            <div class="dropdown-menu" id="user-dropdown-menu">
              <a href="/pages/dashboard.html" class="dropdown-item">Dashboard</a>
              <a href="/pages/profile.html" class="dropdown-item">Profile</a>
              <hr class="dropdown-divider">
              <button class="dropdown-item" id="logout-btn">Logout</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <h1 class="section-title">All Courses</h1>
        <div class="grid grid-3" id="courses-grid">
          <div class="loading-spinner" style="grid-column:1/-1;">Loading courses...</div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 Profound IQ Consulting. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const grid = document.getElementById('courses-grid');
      try {
        const response = await coursesAPI.getAll();
        const courses = response.data || [];

        if (courses.length === 0) {
          grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--gray-500);padding:2rem;">No courses available yet. Check back soon!</p>';
        } else {
          grid.innerHTML = courses.map(course => `
            <div class="card course-card">
              <div class="course-thumb">📚</div>
              <div class="course-body">
                <span class="course-category">${course.category || 'General'}</span>
                <h3 class="course-title">${course.title}</h3>
                <p class="course-instructor">by ${course.instructor_name || 'Unknown'}</p>
                <div class="course-footer">
                  <span class="course-price">${course.currency || 'KES'} ${Number(course.price || 0).toLocaleString()}</span>
                  <a href="/pages/course-detail.html?id=${course.id}" class="btn btn-primary btn-sm">View Course</a>
                </div>
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--red-600);padding:2rem;">Failed to load courses. Please try again later.</p>';
      }

      // Cart count
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      const countEl = document.getElementById('cart-count');
      if (countEl && cart.length > 0) {
        countEl.textContent = cart.length;
        countEl.style.display = 'flex';
      }
    });
  </script>
</body>
</html>
